<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16a34a" />
<title>Offline</title>
<style>
  :root{--bg:#f8fafc;--fg:#0f172a;--muted:#64748b;--faint:#94a3b8;--btn:#16a34a;--btn-h:#15803d;--badge:#334155}
  :root.dark{--bg:#020617;--fg:#fff;--muted:#94a3b8;--faint:#64748b;--badge:#475569}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
  main{width:100%;max-width:24rem;display:grid;gap:28px}
  .logo{position:relative;width:112px;height:112px;margin:0 auto}
  .logo .glow{position:absolute;inset:0;border-radius:2rem;background:rgba(22,163,74,.2);animation:pulse 2s ease-in-out infinite}
  .logo img{position:relative;width:112px;height:112px;border-radius:2rem;box-shadow:0 20px 40px rgba(0,0,0,.2);animation:float 3s ease-in-out infinite;background:#fff;object-fit:cover}
  .badge{position:absolute;right:-8px;bottom:-8px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--badge);box-shadow:0 0 0 4px var(--bg),0 8px 16px rgba(0,0,0,.25);transition:background .3s}
  .badge.on{background:var(--btn)}
  .badge svg{width:20px;height:20px}
  h1{margin:0 0 8px;font-size:1.5rem;font-weight:700}
  p{margin:0}
  #msg{font-size:.875rem;color:var(--muted);min-height:3.5rem;animation:fade .4s ease}
  button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;background:var(--btn);color:#fff;font:600 1rem inherit;font-family:inherit;padding:14px;cursor:pointer;transition:background .2s}
  button:hover{background:var(--btn-h)}
  button:disabled{opacity:.8;cursor:default}
  button svg{width:20px;height:20px}
  button.busy svg{animation:spin 1s linear infinite}
  small{font-size:.75rem;color:var(--faint)}
  @keyframes pulse{50%{opacity:.4;transform:scale(1.06)}}
  @keyframes float{50%{transform:translateY(-6px)}}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script>
  // Match the app's theme (next-themes stores "light" | "dark" | "system" under "theme").
  try{var t=localStorage.getItem("theme");
    if(t==="dark"||((!t||t==="system")&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){}
</script>
</head>
<body>
<main>
  <div class="logo">
    <div class="glow"></div>
    <img src="/icon.png" alt="DARS" width="112" height="112" onerror="this.onerror=null;this.src='/icons/icon-192.png'" />
    <span class="badge" id="badge">
      <svg id="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M2 8.8a15 15 0 0 1 4.2-2.6M19 12.9a10 10 0 0 0-2-1.5M22 8.8a15 15 0 0 0-6.7-3.5M2 2l20 20"/></svg>
      <svg id="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M12 20h.01M2 8.8a15 15 0 0 1 20 0M5 12.9a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/></svg>
    </span>
  </div>
  <div>
    <h1 id="title">You've gone off the grid</h1>
    <p id="msg">Looks like your network wandered off to find itself. Come back online and we'll keep your seat warm. 🪑</p>
  </div>
  <button id="btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
    <span id="btn-label">Check connection</span>
  </button>
  <small>Drexx Technologies · DARS</small>
</main>
<script>
(function(){
  var CHECKING=["Sniffing around for MTN 🐕","Politely knocking on Glo's door…","Chasing signal bars around Ifite…","Waking up the hamsters that power the internet…","Asking the cell tower nicely…"];
  var FAILED=["Still nothing. The internet is playing boju bojuk 🙈","No signal yet. Even NCC is on break ☕","Nope! Your SIM card has left the chat. Try again in a bit."];
  var $=function(id){return document.getElementById(id)};
  var msg=$("msg"),btn=$("btn"),label=$("btn-label"),title=$("title"),badge=$("badge");
  var busy=false,failIdx=0,timer=null;
  function say(t){msg.textContent=t;msg.style.animation="none";void msg.offsetWidth;msg.style.animation=""}
  function check(){
    if(busy)return;busy=true;
    btn.disabled=true;btn.classList.add("busy");label.textContent="Checking…";
    var i=0;say(CHECKING[0]);
    timer=setInterval(function(){i=(i+1)%CHECKING.length;say(CHECKING[i])},1000);
    var started=Date.now(),ctrl=new AbortController(),abort=setTimeout(function(){ctrl.abort()},6000);
    fetch("/api/ping?t="+started,{method:"HEAD",cache:"no-store",signal:ctrl.signal})
      .then(function(r){return r.ok},function(){return false})
      .then(function(ok){
        clearTimeout(abort);
        setTimeout(function(){
          clearInterval(timer);busy=false;btn.classList.remove("busy");
          if(ok){
            title.textContent="Connection found!";say("Omo, Get in joooooor! 🎉 Taking you in…");
            badge.classList.add("on");$("ico-off").hidden=true;$("ico-on").hidden=false;label.textContent="Checking…";
            setTimeout(function(){
              // The SW serves this page for whatever URL failed, so reloading returns the user to it.
              if(location.pathname==="/offline.html")location.replace("/mark");else location.reload();
            },900);
          }else{
            failIdx=(failIdx+1)%FAILED.length;say(FAILED[failIdx]);
            btn.disabled=false;label.textContent="Check connection";
          }
        },Math.max(0,2200-(Date.now()-started)));
      });
  }
  btn.addEventListener("click",check);
  addEventListener("online",check);
})();
</script>
</body>
</html>
